<div class="account-pages my-5 pt-sm-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6 col-xl-5">
        <div class="card overflow-hidden">
          <div class="bg-soft bg-primary">
            <div class="row">
              <div class="col-7">
                <div class="text-primary p-4">
                  <h5 class="text-primary">Bienvenue !</h5>
                  <p>Connectez-vous pour continuer vers INRH.</p>
                </div>
              </div>
              <div class="col-5 align-self-end">
                <img
                  src="assets/images/profile-img.png"
                  alt=""
                  class="img-fluid"
                />
              </div>
            </div>
          </div>
          <div class="card-body pt-0">
            <div>
              <a routerLink="/">
                <div class="avatar-md profile-user-wid mb-4">
                  <span class="avatar-title rounded-circle bg-light">
                    <img
                      src="assets/images/logo.png"
                      alt=""
                      class="rounded-circle"
                      height="34"
                    />
                  </span>
                </div>
              </a>
            </div>
            <div class="p-2">
              <form
                class="form-horizontal"
                [formGroup]="loginForm"
                (ngSubmit)="login()"
              >
                <alert type="danger" *ngIf="error" [dismissible]="false">{{
                  error
                }}</alert>
                <div class="mb-3">
                  <label for="email">Email</label>
                  <input
                    type="email"
                    formControlName="email"
                    class="form-control"
                    id="email"
                    placeholder="Entrer l'email"
                    [ngClass]="{ 'is-invalid': submitted && f.email.errors }"
                  />
                  <div
                    *ngIf="submitted && f.email.errors"
                    class="invalid-feedback"
                  >
                    <div *ngIf="f.email.errors.required">Email is required</div>
                    <div *ngIf="f.email.errors.email">
                      Email must be a valid email address
                    </div>
                  </div>
                </div>
                <div class="mb-3">
                  <label for="password">Password</label>
                  <div class="input-group auth-pass-inputgroup">
                    <input
                      [type]="passwordFieldType"
                      class="form-control"
                      formControlName="password"
                      placeholder="Entrer le mot de passe"
                      [ngClass]="{
                        'is-invalid': submitted && f.password.errors
                      }"
                      aria-label="Password"
                      aria-describedby="password-addon"
                    />
                    <button
                      class="btn btn-light ms-0"
                      type="button"
                      id="password-addon"
                      (click)="togglePasswordVisibility()"
                    >
                      <i
                        [ngClass]="
                          passwordFieldType === 'password'
                            ? 'mdi mdi-eye-outline'
                            : 'mdi mdi-eye-off-outline'
                        "
                      ></i>
                    </button>
                    <div
                      *ngIf="submitted && f.password.errors"
                      class="invalid-feedback"
                    >
                      <span *ngIf="f.password.errors.required"
                        >Password is required</span
                      >
                    </div>
                  </div>
                </div>

                <div class="form-check">
                  <label class="form-check-label" for="remember-check"> </label>
                </div>
                <div class="mt-4 text-center">
                  <a routerLink="/account/reset-password" class="text-muted"
                    ><i class="mdi mdi-lock me-1"></i>Forgot your password?</a
                  >
                </div>
                <div class="mt-3 d-grid">
                  <button class="btn btn-primary" type="submit">
                    Se connecter
                  </button>
                </div>
                <div class="mt-4 text-center"></div>
              </form>
            </div>
          </div>
        </div>
        <div class="mt-5 text-center">
          <p>© 2024 Agilteem.</p>
        </div>
      </div>
    </div>
  </div>
</div>
