<form [formGroup]="form">
  <div class="row mb-4">
    <label for="horizontal-firstname-input" class="col-sm-3 col-form-label">{{"Dt_mes_Milieu"|translate}}</label>
    <div class="col-sm-9">
      <input type="date" class="form-control" formControlName="dateMesureMilieu">
    </div>
  </div>
  <div class="row mb-4">
    <label for="horizontal-email-input" class="col-sm-3 col-form-label">{{"Temp"|translate}}</label>
    <div class="col-sm-9">
      <input type="number" class="form-control" formControlName="temperature">
    </div>
  </div>
  <div class="row mb-4">
    <label for="horizontal-password-input" class="col-sm-3 col-form-label">{{"Salinité"|translate}}</label>
    <div class="col-sm-9">
      <input type="number" class="form-control" formControlName="salinite">
    </div>
  </div>
  <div class="row mb-4">
    <label for="horizontal-password-input" class="col-sm-3 col-form-label">{{"pH"|translate}}</label>
    <div class="col-sm-9">
      <input type="number" class="form-control" formControlName="ph">
    </div>
  </div>
  <div class="row mb-4">
    <label for="horizontal-password-input" class="col-sm-3 col-form-label">{{"Ox_dissous"|translate}}</label>
    <div class="col-sm-9">
      <input type="number" class="form-control" formControlName="oxygeneDissous">
    </div>
  </div>
  <div class="d-flex flex-wrap gap-2">
    <button type="submit" class="btn btn-primary w-md" (click)="formSaveHandler()">{{"Enre"|translate}}</button>
  </div>
</form>
