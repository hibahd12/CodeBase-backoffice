<form [formGroup]="form">
  <div class="row mb-4">
    <label for="horizontal-password-input" class="col-sm-3 col-form-label">Laboratoire responsable</label>
    <div class="col-sm-9">
      <OhmNgSelect [items]="LabosResponsables" [placeholder]="'Laboratoire responsable'" [bindLabel]="'title'"
        [bindValue]="'_id'" [entityName]="environment.entityNameLaboResponsable" (loadData)="getLabosResponsables()"
        (eventEmitterOnAdd)="onAddItem($event)" formControlName="idLaboResponsable" [multiple]="false">
      </OhmNgSelect>
    </div>
  </div>
  <div class="row mb-4">
    <label for="horizontal-firstname-input" class="col-sm-3 col-form-label">{{"Date_échanti1"|translate}}</label>
    <div class="col-sm-9">
      <input type="date" class="form-control" formControlName="dateEchantillonnageChimi1">
    </div>
  </div>
  <div class="row mb-4">
    <label for="horizontal-email-input" class="col-sm-3 col-form-label">{{"Cd"|translate}}</label>
    <div class="col-sm-9">
      <input type="number" class="form-control" formControlName="cd">
    </div>
  </div>
  <div class="row mb-4">
    <label for="horizontal-password-input" class="col-sm-3 col-form-label">{{"Pb"|translate}}</label>
    <div class="col-sm-9">
      <input type="number" class="form-control" formControlName="pb">
    </div>
  </div>
  <div class="row mb-4">
    <label for="horizontal-password-input" class="col-sm-3 col-form-label">{{"Hg"|translate}}</label>
    <div class="col-sm-9">
      <input type="number" class="form-control" formControlName="hg">
    </div>
  </div>
  <div class="row mb-4">
    <label for="horizontal-firstname-input" class="col-sm-3 col-form-label">{{"Date_échanti2"|translate}}</label>
    <div class="col-sm-9">
      <input type="date" class="form-control" formControlName="dateEchantillonnageChimi2">
    </div>
  </div>
  <div class="row mb-4">
    <label for="horizontal-password-input" class="col-sm-3 col-form-label">{{"∑HAP"|translate}}</label>
    <div class="col-sm-9">
      <input type="number" class="form-control" formControlName="hap">
    </div>
  </div>
  <div class="row mb-4">
    <label for="horizontal-password-input" class="col-sm-3 col-form-label">{{"∑PCB (ng/g pf)"}}</label>
    <div class="col-sm-9">
      <input type="number" class="form-control" formControlName="pcb">
    </div>
  </div>
  <div class="row mb-4">
    <label for="horizontal-password-input" class="col-sm-3 col-form-label">{{"∑dioxines"|translate}}</label>
    <div class="col-sm-9">
      <input type="number" class="form-control" formControlName="dioxines">
    </div>
  </div>
  <div class="row mb-4">
    <label for="horizontal-password-input" class="col-sm-3 col-form-label">{{"∑dioxines_PCB_tp_diox"|translate}}</label>
    <div class="col-sm-9">
      <input type="number" class="form-control" formControlName="dioxinesAndPcbTypeDioxine">
    </div>
  </div>
  <div class="d-flex flex-wrap gap-2">
    <button type="submit" class="btn btn-primary w-md" (click)="formSaveHandler()">{{"Enre"|translate}}</button>
    <button type="submit" class="btn btn-secondary w-md">{{"Ann"|translate}}</button>
  </div>
</form>
