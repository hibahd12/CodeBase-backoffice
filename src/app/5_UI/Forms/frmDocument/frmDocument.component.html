<div>
    <form [formGroup]="form">
        <div class="modal-body">
            <div class="row ">
                <div class="col-12">
                    <div class="card p-5">
                        <h5 class="mb-0">{{"Nouveau document" | translate}}</h5>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-lg-6">
                                    <div class="mb-3">
                                        <label class="form-label">{{"Titre" | translate}}<span
                                                class="star">*</span></label>
                                        <input class="form-control" formControlName="titre"
                                            type="text" />
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="mb-3">
                                        <label class="form-label">{{"Document" | translate}}<span
                                                class="star">*</span></label>
                                        <input class="form-control" formControlName="document"
                                        (change)="onDocumentSelected($event)"
                                            type="file" />
                                    </div>
                                </div>
                            </div>
                            
                           
                        </div>
                        <div class="d-flex justify-content-center">
                            <button class="btn btn-primary me-2 w-25" (click)="saveRecord()">Enregistrer</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
