<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <div class="row mb-2">
                        <div class="col-sm-4">
                            <div class="search-box me-2 mb-2 d-inline-block">
                                <div class="position-relative">
                                    <h2 class="titre-h2 titre-table mar-bott-20">Alertes</h2>

                                </div>
                            </div>
                        </div>
                        <div class="col-sm-8">
                            <div class="text-sm-end">
                                <button type="button" class="btn btn-success btn-rounded mb-2 me-2"
                                    (click)="NavigateToForm('Sys_FrmDemandeAlerte')"><i class="mdi mdi-plus mr-1"></i>
                                    Ajouter une alerte</button>
                            </div>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <div class="table-responsive mb-0">
                            <table class="table table-centered table-nowrap">
                                <thead class="table-light">
                                    <tr>
                                        <th>Lieux</th>
                                        <th>date</th>
                                        <th>Nature</th>
                                        <th>Catégorie</th>
                                        <th>Espéces</th>
                                        <th>Lieux</th>
                                        <!-- <th>Action</th> -->
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let alert of dataGrid ">
                                        <td>{{ alert?.selectedPort }}</td>
                                        <td>{{ alert?.date_alert }}</td>
                                        <td>{{ alert?.nature }}</td>
                                        <td>{{ alert?.category }} </td>
                                        <td>{{ alert?.selectedSpecie }}</td>
                                        <td>{{ alert?.selectedPort }}</td>
                                        <!-- <td><button type="button" class="btn btn-info btn-rounded mb-2 me-2"
                                                (click)="openForm('Sys_FrmDemandeAlerte', alert)">
                                                <i class="fas fa-folder-open"></i>
                                                Voir</button></td> -->
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
